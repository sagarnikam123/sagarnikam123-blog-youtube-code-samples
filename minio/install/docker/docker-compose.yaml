# MinIO - Standalone Docker Compose (S3 object store for Loki)
#
# Usage:
#   docker compose up -d
#   docker compose logs -f minio
#
# Access:
#   - S3 API:      http://localhost:9000
#   - Console UI:  http://localhost:9001   (login: minioadmin / minioadmin)
#
# Buckets are pre-created by the `createbuckets` init service so the Loki
# configs in loki/configs/v3.x/v3.7.x/ work out of the box:
#   - loki-data    (used by loki-3.7.x-ui-minio-*.yaml)
#   - loki-chunks  (used by loki-3.7.x-ui-minio-thanos-*.yaml)
#   - loki-ruler   (ruler rule storage, if you switch ruler storage to s3)
#   - loki-admin   (admin/compactor)
#
# NOTE ON IMAGES: the official minio/minio image on Docker Hub / quay.io may
# reject anonymous pulls (401). If `docker compose up` fails to pull minio,
# either `docker login`, or switch the image to `cgr.dev/chainguard/minio`
# (public) — see the k8s manifest under ../k8s for that variant.

services:
  # One-shot: pre-create the buckets as directories on the data volume BEFORE
  # MinIO starts. A MinIO bucket is just a top-level dir in the data dir, so this
  # avoids needing the `mc` client (which ships as a separate, gated image).
  createbuckets:
    image: busybox:1.36
    container_name: minio-createbuckets
    command: >
      /bin/sh -c "mkdir -p /data/loki-data /data/loki-chunks /data/loki-ruler /data/loki-admin;
      echo 'buckets:'; ls -1 /data"
    volumes:
      - minio-data:/data
    restart: "no"

  minio:
    image: minio/minio:latest
    container_name: minio
    depends_on:
      createbuckets:
        condition: service_completed_successfully
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      # server image has no `mc`; hit the HTTP health endpoint instead.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  minio-data:
