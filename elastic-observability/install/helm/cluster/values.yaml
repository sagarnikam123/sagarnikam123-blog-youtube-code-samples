eck-elasticsearch:
  enabled: true
  nodeSets:
    - name: hot
      count: 3
      config:
        node.roles: [master, data_hot, data_content, ingest]
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 50Gi
    - name: warm
      count: 2
      config:
        node.roles: [data_warm]
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 100Gi

eck-kibana:
  enabled: true
  spec:
    count: 2

eck-apm-server:
  enabled: true
  spec:
    count: 2
