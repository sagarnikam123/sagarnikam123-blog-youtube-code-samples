# =============================================================================
# SigNoz - Complete Docker Compose Setup for Benchmarking
# =============================================================================
# Architecture: ClickHouse Keeper + ClickHouse + Schema Migrator + OTel Collector + SigNoz Server
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# Access:
#   - SigNoz UI:     http://localhost:${SIGNOZ_UI_PORT:-3301}
#   - OTLP gRPC:     localhost:${OTLP_GRPC_PORT:-4317}
#   - OTLP HTTP:     localhost:${OTLP_HTTP_PORT:-4318}
#
# Boot order:
#   clickhouse-keeper → clickhouse → schema-migrator → otel-collector + signoz
# =============================================================================

services:
  # --------------------------------------------------------------------------
  # ClickHouse Keeper (ZooKeeper replacement)
  # --------------------------------------------------------------------------
  clickhouse-keeper:
    image: clickhouse/clickhouse-keeper:${CLICKHOUSE_KEEPER_VERSION:-25.5.6}
    container_name: signoz-clickhouse-keeper
    restart: unless-stopped
    volumes:
      - clickhouse-keeper-data:/var/lib/clickhouse-keeper
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 9181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - signoz

  # --------------------------------------------------------------------------
  # ClickHouse Storage
  # --------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.5.6}
    container_name: signoz-clickhouse
    restart: unless-stopped
    depends_on:
      clickhouse-keeper:
        condition: service_healthy
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: signoz_traces
    deploy:
      resources:
        limits:
          memory: ${CLICKHOUSE_MAX_MEMORY:-4g}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - signoz

  # --------------------------------------------------------------------------
  # PostgreSQL (metadata store)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    container_name: signoz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: signoz
      POSTGRES_PASSWORD: signoz
      POSTGRES_DB: signoz
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signoz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signoz

  # --------------------------------------------------------------------------
  # Schema Migrator (one-shot: creates DBs and tables in ClickHouse)
  # --------------------------------------------------------------------------
  schema-migrator:
    image: signoz/signoz:${SIGNOZ_VERSION:-v0.130.0}
    container_name: signoz-schema-migrator
    command: ["./signoz", "migrate", "--dsn", "tcp://clickhouse:9000"]
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SIGNOZ_SQLSTORE_DATASOURCE: postgres://signoz:signoz@postgres:5432/signoz?sslmode=disable
    restart: "no"
    networks:
      - signoz

  # --------------------------------------------------------------------------
  # OpenTelemetry Collector (ingestion endpoint)
  # --------------------------------------------------------------------------
  otel-collector:
    image: signoz/signoz-otel-collector:${OTEL_COLLECTOR_VERSION:-v0.111.10}
    container_name: signoz-otel-collector
    restart: unless-stopped
    command:
      - --config=/etc/otel-collector-config.yaml
    depends_on:
      schema-migrator:
        condition: service_completed_successfully
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - signoz

  # --------------------------------------------------------------------------
  # SigNoz Server (API + UI)
  # --------------------------------------------------------------------------
  signoz:
    image: signoz/signoz:${SIGNOZ_VERSION:-v0.130.0}
    container_name: signoz-server
    restart: unless-stopped
    command: ["./signoz", "server"]
    depends_on:
      schema-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "${SIGNOZ_UI_PORT:-3301}:8080"
    environment:
      SIGNOZ_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_SQLSTORE_DATASOURCE: postgres://signoz:signoz@postgres:5432/signoz?sslmode=disable
    deploy:
      resources:
        limits:
          memory: ${SIGNOZ_MAX_MEMORY:-2g}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - signoz

networks:
  signoz:
    driver: bridge

volumes:
  clickhouse-keeper-data:
  clickhouse-data:
  postgres-data:
