apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: observability
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        # Injects the OpenTelemetry Operator Java Agent automatically!
        instrumentation.opentelemetry.io/inject-java: "true"
    spec:
      containers:
        - name: app
          image: eclipse-temurin:21-jre-alpine
          command: ["sh", "-c", "sleep 3600"]
