# =============================================================================
# OpenSearch Observability - Docker Compose Setup for Benchmarking
# =============================================================================
# OpenSearch + OpenSearch Dashboards + Data Prepper (OTLP → OpenSearch pipeline)
# Security plugin disabled for benchmark simplicity.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# Access:
#   - OpenSearch Dashboards: http://localhost:${DASHBOARDS_PORT:-5601}
#   - OpenSearch API:        http://localhost:${OPENSEARCH_PORT:-9200}
#   - OTLP gRPC:            localhost:${OTLP_GRPC_PORT:-4317} (via Data Prepper)
#   - OTLP HTTP:            localhost:${OTLP_HTTP_PORT:-4318} (via Data Prepper)
# =============================================================================

services:
  # --------------------------------------------------------------------------
  # OpenSearch (single-node, security disabled)
  # --------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.19.1}
    container_name: opensearch-node
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms2g -Xmx2g}
      - cluster.name=benchmark
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - opensearch

  # --------------------------------------------------------------------------
  # OpenSearch Dashboards (UI)
  # --------------------------------------------------------------------------
  dashboards:
    image: opensearchproject/opensearch-dashboards:${DASHBOARDS_VERSION:-2.19.1}
    container_name: opensearch-dashboards
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "${DASHBOARDS_PORT:-5601}:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q 'available'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - opensearch

  # --------------------------------------------------------------------------
  # Data Prepper (OTLP ingestion → OpenSearch)
  # --------------------------------------------------------------------------
  data-prepper:
    image: opensearchproject/data-prepper:${DATA_PREPPER_VERSION:-2.11.0}
    container_name: opensearch-data-prepper
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "${OTLP_GRPC_PORT:-4317}:21890"
      - "${OTLP_HTTP_PORT:-4318}:21891"
      - "4900:4900"
    volumes:
      - ./config/data-prepper-pipelines.yaml:/usr/share/data-prepper/pipelines/pipelines.yaml:ro
      - ./config/data-prepper-config.yaml:/usr/share/data-prepper/config/data-prepper-config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4900/list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - opensearch

networks:
  opensearch:
    driver: bridge

volumes:
  opensearch-data:
