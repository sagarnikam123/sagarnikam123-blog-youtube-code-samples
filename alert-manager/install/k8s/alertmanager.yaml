# =============================================================================
# Alertmanager - Kubernetes manifest
# =============================================================================
# Receives alerts from the Loki ruler (ruler.alertmanager_url) and routes them
# to a webhook. Mirrors configs/alertmanager.yaml but for in-cluster use.
#
# Deploy:
#   kubectl create namespace alerting --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n alerting apply -f alertmanager.yaml
#   kubectl -n alerting rollout status deploy/alertmanager
#
# Point the Loki ruler at it (in-cluster):
#   ruler:
#     alertmanager_url: http://alertmanager.alerting.svc.cluster.local:9093
#     enable_alertmanager_v2: true
#     external_url: http://<grafana-or-loki>   # MUST include scheme, else 422
#
# Access UI:
#   kubectl -n alerting port-forward svc/alertmanager 9093:9093   # http://localhost:9093
#
# EDIT THE WEBHOOK URL below (webhook.site UUID or your own receiver) before applying.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  labels: { app: alertmanager }
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'job', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      receiver: default
      routes:
        - match:
            severity: critical
          receiver: default
          group_wait: 10s
          continue: true
    receivers:
      - name: default
        webhook_configs:
          # EDIT: replace with your webhook.site URL or real receiver.
          - url: https://webhook.site/00000000-0000-0000-0000-000000000000
            send_resolved: true
    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal: ['alertname', 'job']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels: { app: alertmanager }
spec:
  replicas: 1
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
      annotations:
        # roll the pod when the config changes (checksum could be added by CI)
        config-source: configs/alertmanager.yaml
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=0.0.0.0:9093
            - --log.level=info
          ports:
            - { name: http, containerPort: 9093 }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9093 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9093 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: data, mountPath: /alertmanager }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
        - name: data
          emptyDir: {}   # POC: silences/notification state are ephemeral
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels: { app: alertmanager }
spec:
  selector: { app: alertmanager }
  ports:
    - { name: http, port: 9093, targetPort: 9093 }
