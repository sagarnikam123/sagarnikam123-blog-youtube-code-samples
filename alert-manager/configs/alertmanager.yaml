# Alertmanager Configuration
# Receives alerts from Loki ruler and routes them to receivers
#
# For this eval setup, alerts go to a webhook (webhook.site or local receiver)
# and are also visible in the Alertmanager UI at http://localhost:9093

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 30s        # wait before sending first notification for a new group
  group_interval: 5m     # wait before sending updated notification for existing group
  repeat_interval: 1h    # re-send if alert still firing after this
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: critical
      group_wait: 10s    # faster notification for critical
      continue: true     # also send to default

receivers:
  - name: default
    webhook_configs:
      # ponytail: for eval only — replace with real webhook/email/slack in production.
      # Local receiver (Docker): prints alerts to `webhook-receiver` container logs.
      - url: http://webhook-receiver:5001/alerts
        send_resolved: true
      # Public inspector: uncomment to also POST alerts to your webhook.site URL
      # (handy when running in k8s where the local receiver isn't wired up).
      # - url: https://webhook.site/<your-uuid>
      #   send_resolved: true

  - name: critical
    webhook_configs:
      - url: http://webhook-receiver:5001/alerts
        send_resolved: true
      # - url: https://webhook.site/<your-uuid>
      #   send_resolved: true

# Inhibition: suppress warning if critical already firing for same job
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'job']

# Templates (optional, uncomment to use custom notification templates)
# templates:
#   - '/etc/alertmanager/templates/*.tmpl'
