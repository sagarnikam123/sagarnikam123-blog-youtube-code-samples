# -- Image
# NOTE: grafana/grafana-oss has no 13.2.x tag (its latest is 13.0.2), so
# grafana/grafana-oss:13.2.0 fails to pull (404). Use grafana/grafana, which
# publishes 13.2.x and is the standard OSS image.
image:
  repository: grafana/grafana
  tag: "13.2.2"
  pullPolicy: IfNotPresent

# -- Admin credentials
adminUser: admin
# adminPassword: ""  # auto-generated if not set, retrieve with:
# kubectl get secret -n grafana grafana -o jsonpath="{.data.admin-password}" | base64 --decode

# -- Persistence
persistence:
  enabled: false  # set true for production

# -- Resources
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# -- Loki datasource pre-configured
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.loki.svc.cluster.local
        isDefault: true
        jsonData:
          maxLines: 1000
