# =============================================================================
# Grafana LGTM Stack - Unified Docker Compose Setup for Benchmarking
# =============================================================================
# Composable best-of-breed stack: Loki (logs) + Grafana (UI) + Tempo (traces) + Mimir (metrics)
# OTel Collector fans out OTLP signals to all three backends.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# Access:
#   - Grafana UI:   http://localhost:${GRAFANA_PORT:-3000}
#   - OTLP gRPC:    localhost:${OTLP_GRPC_PORT:-4317}
#   - OTLP HTTP:    localhost:${OTLP_HTTP_PORT:-4318}
# =============================================================================

services:
  # --------------------------------------------------------------------------
  # Mimir (metrics backend - monolithic mode)
  # --------------------------------------------------------------------------
  mimir:
    image: grafana/mimir:${MIMIR_VERSION:-2.16.0}
    container_name: lgtm-mimir
    restart: unless-stopped
    command: ["-config.file=/etc/mimir/config.yaml"]
    volumes:
      - ./config/mimir-config.yaml:/etc/mimir/config.yaml:ro
      - mimir-data:/data/mimir
    deploy:
      resources:
        limits:
          memory: ${MIMIR_MEMORY:-2g}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9009/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lgtm

  # --------------------------------------------------------------------------
  # Loki (logs backend - monolithic mode)
  # --------------------------------------------------------------------------
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.5.0}
    container_name: lgtm-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./config/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: ${LOKI_MEMORY:-2g}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lgtm

  # --------------------------------------------------------------------------
  # Tempo (traces backend - monolithic mode)
  # --------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.7.2}
    container_name: lgtm-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./config/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    deploy:
      resources:
        limits:
          memory: ${TEMPO_MEMORY:-2g}
    depends_on:
      mimir:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lgtm

  # --------------------------------------------------------------------------
  # OpenTelemetry Collector (OTLP ingestion → Loki/Mimir/Tempo)
  # --------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.115.0}
    container_name: lgtm-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      loki:
        condition: service_healthy
      mimir:
        condition: service_healthy
      tempo:
        condition: service_healthy
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lgtm

  # --------------------------------------------------------------------------
  # Grafana (visualization - pre-provisioned datasources)
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.1.1}
    container_name: lgtm-grafana
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
      mimir:
        condition: service_healthy
      tempo:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor traceQLStreaming metricsSummary
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - lgtm

networks:
  lgtm:
    driver: bridge

volumes:
  mimir-data:
  loki-data:
  tempo-data:
  grafana-data:
