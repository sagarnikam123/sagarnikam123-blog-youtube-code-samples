apiVersion: v1
kind: ConfigMap
metadata:
  name: beyla-config
  namespace: beyla
data:
  beyla-config.yaml: |
    discovery:
      instrument:
        - k8s_namespace: default
    otel_traces_export:
      endpoint: http://otel-collector.monitoring:4318
    otel_metrics_export:
      endpoint: http://otel-collector.monitoring:4318
    prometheus_export:
      port: 9400
      path: /metrics
    attributes:
      kubernetes:
        enable: true
    routes:
      unmatched: heuristic
    log_level: INFO
