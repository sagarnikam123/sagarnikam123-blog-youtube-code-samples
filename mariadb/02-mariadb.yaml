apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: mariadb-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.6
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-user
              key: root-password
        - name: MARIADB_USER
          valueFrom:
            secretKeyRef:
              name: mariadb-user
              key: username
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-user
              key: password
        - name: MARIADB_DATABASE
          value: testdb
        ports:
        - containerPort: 3306
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: mariadb-test
spec:
  selector:
    app: mariadb
  ports:
  - port: 3306
    targetPort: 3306
  type: ClusterIP
