# =============================================================================
# VictoriaMetrics Full Stack - Docker Compose Setup for Benchmarking
# =============================================================================
# Specialized signal-specific databases:
#   VictoriaMetrics (metrics) + VictoriaLogs (logs) + VictoriaTraces (traces)
#   + OTel Collector (ingestion) + Grafana (UI)
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# Access:
#   - Grafana UI:          http://localhost:${GRAFANA_PORT:-3000}
#   - VictoriaMetrics UI:  http://localhost:${VM_PORT:-8428}/vmui
#   - OTLP gRPC:           localhost:${OTLP_GRPC_PORT:-4317}
#   - OTLP HTTP:           localhost:${OTLP_HTTP_PORT:-4318}
# =============================================================================

services:
  # --------------------------------------------------------------------------
  # VictoriaMetrics (metrics TSDB)
  # --------------------------------------------------------------------------
  victoriametrics:
    image: victoriametrics/victoria-metrics:${VICTORIAMETRICS_VERSION:-v1.149.0}
    container_name: vm-victoriametrics
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${VM_RETENTION:-30d}
      - -httpListenAddr=:8428
      - -search.latencyOffset=0s
    ports:
      - "${VM_PORT:-8428}:8428"
    volumes:
      - vm-data:/storage
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8428/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - victoria

  # --------------------------------------------------------------------------
  # VictoriaLogs (log storage)
  # --------------------------------------------------------------------------
  victorialogs:
    image: victoriametrics/victoria-logs:${VICTORIALOGS_VERSION:-v1.52.0-victorialogs}
    container_name: vm-victorialogs
    restart: unless-stopped
    command:
      - -storageDataPath=/vlogs
      - -httpListenAddr=:9428
      - -retention.maxDiskSpaceUsageBytes=50GB
    volumes:
      - vl-data:/vlogs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9428/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - victoria

  # --------------------------------------------------------------------------
  # VictoriaTraces (trace storage - Jaeger/Tempo compatible query API)
  # --------------------------------------------------------------------------
  victoriatraces:
    image: victoriametrics/victoria-traces:${VICTORIATRACES_VERSION:-v0.11.0-victorialogs}
    container_name: vm-victoriatraces
    restart: unless-stopped
    command:
      - -storageDataPath=/vtraces
      - -httpListenAddr=:16686
      - -opentelemetry.grpc.listenAddr=:4317
    volumes:
      - vt-data:/vtraces
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - victoria

  # --------------------------------------------------------------------------
  # OpenTelemetry Collector (OTLP ingestion → VM/VL/VT)
  # --------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.115.0}
    container_name: vm-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_healthy
      victoriatraces:
        condition: service_healthy
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - victoria

  # --------------------------------------------------------------------------
  # Grafana (visualization)
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.1.1}
    container_name: vm-grafana
    restart: unless-stopped
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_healthy
      victoriatraces:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_INSTALL_PLUGINS: "victoriametrics-logs-datasource"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - victoria

networks:
  victoria:
    driver: bridge

volumes:
  vm-data:
  vl-data:
  vt-data:
  grafana-data:
