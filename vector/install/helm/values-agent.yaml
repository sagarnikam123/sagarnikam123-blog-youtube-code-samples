# Vector Helm — Agent role (DaemonSet)
# Collects logs from all pods on each node
role: Agent

customConfig:
  api:
    enabled: true
    address: 0.0.0.0:8686
  sources:
    kubernetes_logs:
      type: kubernetes_logs
    host_metrics:
      type: host_metrics
      collectors:
        - cpu
        - memory
        - disk
        - network
  transforms:
    parse:
      type: remap
      inputs: [kubernetes_logs]
      source: |
        .cluster = "my-cluster"
  sinks:
    console:
      type: console
      inputs: [parse, host_metrics]
      encoding:
        codec: json
