# Vector: journald (systemd logs) → VRL enrich → Loki
api:
  enabled: true
  address: 0.0.0.0:8686

sources:
  journald:
    type: journald
    include_units:
      - docker
      - sshd
      - nginx

transforms:
  enrich:
    type: remap
    inputs: [journald]
    source: |
      .host = get_hostname!()
      .level = .PRIORITY ?? "6"

sinks:
  loki:
    type: loki
    inputs: [enrich]
    endpoint: http://localhost:3100
    labels:
      unit: "{{ _SYSTEMD_UNIT }}"
      host: "{{ host }}"
      priority: "{{ level }}"
    encoding:
      codec: json
