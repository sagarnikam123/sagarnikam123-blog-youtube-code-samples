# Vector: file logs → VRL transform → OpenSearch
api:
  enabled: true
  address: 0.0.0.0:8686

sources:
  app_logs:
    type: file
    include:
      - /var/log/app/*.log
    read_from: beginning

transforms:
  parse:
    type: remap
    inputs: [app_logs]
    source: |
      . = parse_json!(.message)
      .@timestamp = now()
      .host = get_hostname!()

sinks:
  opensearch:
    type: elasticsearch
    inputs: [parse]
    api_version: v7
    endpoints:
      - http://localhost:9200
    bulk:
      index: "app-logs-%Y.%m.%d"
    auth:
      strategy: basic
      user: admin
      password: admin
